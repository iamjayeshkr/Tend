plugins { id 'com.android.application' }

android {
    namespace 'app.tend'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'app.tend'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'app.tend.NativeSmokeTest'
        versionCode 16
        versionName '1.1.14'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def signingFile = rootProject.file('signing.properties')
            if (signingFile.exists()) {
                def signing = new Properties()
                signingFile.withInputStream { signing.load(it) }
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
